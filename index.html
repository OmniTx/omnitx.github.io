<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniTx | Terminal</title>
    <meta name="description" content="OmniTx - Developer Terminal Dashboard">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style3.css">
</head>

<body>
    <div class="terminal-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="traffic-lights">
                    <span class="light red"></span>
                    <span class="light yellow"></span>
                    <span class="light green"></span>
                </div>
                <div class="sidebar-title">TERM - omnitx</div>
            </div>

            <div class="file-explorer">
                <div class="folder open">
                    <span class="folder-icon">📂</span> root
                </div>
                <ul class="file-list">
                    <li class="file-item active" data-file="home">
                        <span class="file-icon">📝</span> README.md
                    </li>
                    <li class="file-item" data-file="about">
                        <span class="file-icon">👤</span> about.json
                    </li>
                    <li class="file-item" data-file="stack">
                        <span class="file-icon">⚙️</span> skills.yml
                    </li>
                    <li class="file-item" data-file="projects">
                        <span class="file-icon">📦</span> projects.js
                    </li>
                    <li class="file-item" data-file="contact">
                        <span class="file-icon">📧</span> contact.sh
                    </li>
                </ul>
            </div>

            <div class="sidebar-footer">
                <a href="index_classic.html" class="mode-switch">Classic Mode</a>
                <a href="index2.html" class="mode-switch">Grid Mode</a>
            </div>
        </aside>

        <!-- Main Editor Area -->
        <main class="editor-area">
            <!-- Tabs -->
            <div class="tabs-bar">
                <div class="tab active" data-tab="home">
                    <span class="file-icon">📝</span> README.md
                </div>
                <!-- Dynamic tabs can go here -->
            </div>

            <!-- Content Area -->
            <div class="code-viewport" id="viewport">
                <!-- Content injected via JS -->
            </div>

            <!-- Terminal / Input Area -->
            <div class="terminal-input-area">
                <div class="command-line">
                    <span class="prompt">omnitx@dev:~$</span>
                    <input type="text" id="cmd-input" placeholder="Type 'help' for commands..." autocomplete="off">
                </div>
            </div>
        </main>
    </div>

    <script src="script3.js"></script>
</body>

</html>
